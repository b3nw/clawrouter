schema: clawrouter.service-provider.v1
id: nvidia-nim
displayName: NVIDIA NIM
status: stable
class: openai_compatible
service:
  platform: nvidia
  kind: model_provider
  configKeys: [NVIDIA_NIM_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://integrate.api.nvidia.com
routing:
  nativePrefixes: [clawrouter-nvidia-nim, nvidia-nim]
  modelPrefixes: [nvidia-nim/]
  modelPassthrough: true
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries: []
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
